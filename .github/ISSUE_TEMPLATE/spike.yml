name: Spike
description: Time-boxed investigation to answer a question
type: Spike
body:
  - type: textarea
    id: question
    attributes:
      label: The question to answer
      description: A spike ends when this is answered — not when the time runs out with notes.
    validations:
      required: true
  - type: input
    id: timebox
    attributes:
      label: Time box
      description: e.g. "one day". A spike without a limit is just unplanned work.
    validations:
      required: true
  - type: textarea
    id: unblocks
    attributes:
      label: What decision or work does this unblock
      description: Link it. A spike that unblocks nothing should probably not be done.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: What the output looks like
      description: A recommendation, a prototype, a benchmark, a written answer on the issue?
