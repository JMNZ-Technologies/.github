# .github/gates.yml for .github (ADR-032), generated by
# scripts/gen-gates-yml.py from this repo's own .github/workflows/*.yml (plus one hop
# into shared/.github/workflows/*.yml for reusable callers). This is a STRUCTURAL seed,
# not a measured one: `required` here means the check's job id/name matches ADR-032
# orchestrator#211's classification (typecheck/unit/lint/contracts required;
# e2e-real/chaos/perf/mutation advisory), or it bundles those into one job
# (service-ci.yml's `validate`) or is the fleet's branch/commit policy gate
# (gitflow-guard). gate-health re-measures every gate nightly (ADR-032 §2/§6) and opens
# a gate-untrusted issue proposing demotion if one doesn't hold up -- this file does not
# need to be perfect on day one.
#
# scripts/gate-health/examples/*.gates.yml holds richer, MEASURED proposals from the
# 2026-09-16 trailing-14-day dry run for apps/bffs/orchestrator/ms-auth; reconcile this
# file against them by hand where they disagree -- that data source knows things (real
# green/false-red rates) this generator cannot.
#
# Regenerate with: python3 scripts/gen-gates-yml.py <repo> --check
version: 1
gates:
  - check: "gitflow-guard / gitflow-guard / gitflow-guard"
    since: 2026-10-07
